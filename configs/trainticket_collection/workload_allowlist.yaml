api_base: http://localhost:18888
notes:
  - TT-Core-16 Pilot only allows API paths whose expected downstream services are deployed.
  - Latency observed through port-forward is recorded for diagnostics only, not for SLO labels.
  - Authenticated order/contact APIs are deployed but not called by the current unauthenticated functional Oracle.
  - Disabled operations must not be included in workload generation or drift labels.
deployment_core_services:
  - ts-auth-service
  - ts-basic-service
  - ts-config-service
  - ts-contacts-service
  - ts-gateway-service
  - ts-order-other-service
  - ts-order-service
  - ts-price-service
  - ts-route-service
  - ts-seat-service
  - ts-station-service
  - ts-train-service
  - ts-travel-service
  - ts-travel2-service
  - ts-ui-dashboard
  - ts-user-service
core_api_services:
  - ts-auth-service
  - ts-basic-service
  - ts-config-service
  - ts-gateway-service
  - ts-price-service
  - ts-route-service
  - ts-seat-service
  - ts-station-service
  - ts-train-service
  - ts-travel-service
  - ts-travel2-service
  - ts-user-service
deployed_but_not_oracle_services:
  - ts-contacts-service
  - ts-order-other-service
  - ts-order-service
  - ts-ui-dashboard
supporting_services:
  - nacos
  - rabbitmq
  - scwarn-pilot-mysql
excluded_from_api_closure:
  - ts-ui-dashboard
operations:
  - id: auth_hello
    operation: auth smoke
    method: GET
    path: /api/v1/auth/hello
    expected_status: 200
    expected_contains: hello
    expected_services:
      - ts-gateway-service
      - ts-auth-service
    enabled: true
    slo_source: functional_only

  - id: user_hello
    operation: user smoke
    method: GET
    path: /api/v1/userservice/users/hello
    expected_status: 200
    expected_contains: Hello
    expected_services:
      - ts-gateway-service
      - ts-user-service
    enabled: true
    slo_source: functional_only

  - id: basic_welcome
    operation: basic service smoke
    method: GET
    path: /api/v1/basicservice/welcome
    expected_status: 200
    expected_contains: Welcome to [ Basic Service ]
    expected_services:
      - ts-gateway-service
      - ts-basic-service
    enabled: true
    slo_source: functional_only

  - id: config_welcome
    operation: config service smoke
    method: GET
    path: /api/v1/configservice/welcome
    expected_status: 200
    expected_contains: Welcome
    expected_services:
      - ts-gateway-service
      - ts-config-service
    enabled: true
    slo_source: functional_only

  - id: contacts_welcome
    operation: contacts service smoke
    method: GET
    path: /api/v1/contactservice/contacts/welcome
    expected_status: 200
    expected_contains: Welcome
    expected_services:
      - ts-gateway-service
      - ts-contacts-service
    enabled: false
    disabled_reason: requires JWT role and is excluded until tokenized business workflow is added
    slo_source: functional_only

  - id: order_welcome
