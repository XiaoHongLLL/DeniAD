    path: /api/v1/orderservice/welcome
    expected_status: 200
    expected_contains: Welcome
    expected_services:
      - ts-gateway-service
      - ts-order-service
    enabled: false
    disabled_reason: requires JWT role; /welcome is not permitAll in service security config
    slo_source: functional_only

